    <nav class="nav-group">
      <div class="nav-group__label">Visão geral</div>
      <a href="#/dashboard" class="nav-link" data-route="dashboard"><span>Dashboard</span></a>
    </nav>

    <nav class="nav-group">
      <div class="nav-group__label">Elenco &amp; jogos</div>
      <a href="#/jogadores" class="nav-link" data-route="jogadores"><span>Jogadores</span></a>
      <a href="#/jogos" class="nav-link" data-route="jogos"><span>Jogos</span></a>

      <a href="#/campeonatos" class="nav-link" data-route="campeonatos"><span>Campeonatos</span></a>
      <a href="#/amistosos" class="nav-link" data-route="amistosos"><span>Amistosos</span></a>
      <a href="#/calendario" class="nav-link" data-route="calendario"><span>Calendário</span></a>
    </nav>

    <nav class="nav-group">

      <a href="#/estatisticas" class="nav-link" data-route="estatisticas"><span>Estatísticas</span></a>
      <a href="#/confrontos" class="nav-link" data-route="confrontos"><span>Confrontos</span></a>
      <a href="#/compartilhamentos" class="nav-link" data-route="compartilhamentos"><span>Compartilhamentos</span></a>
      <a href="#/documentos" class="nav-link" data-route="documentos"><span>Documentos</span></a>

    <div class="sidebar-footer">
      <span class="u-tertiary" style="font-size:var(--fs-xs)">Modo escuro</span>
      <button class="theme-toggle js-theme-toggle"><span class="theme-toggle__knob"></span></button>

  <!-- ===== Conteúdo principal ===== -->

<!-- ===== Scripts (ordem importa) ===== -->
<script src="js/core/icons.js"></script>

<script src="js/modules/players.js"></script>
<script src="js/modules/matches.js"></script>

<script src="js/modules/calendar.js"></script>
<script src="js/modules/statistics.js"></script>
<script src="js/modules/confrontos.js"></script>
<script src="js/modules/sharing.js"></script>
<script src="js/modules/documents.js"></script>
<script src="js/modules/lineup.js"></script>
<script src="js/modules/settings.js"></script>
<script src="js/core/pending-check.js"></script>
<script src="js/app.js"></script>

<script>
  // Injeta os ícones SVG nos links de navegação (feito em JS pra manter o HTML acima legível)
  document.addEventListener('DOMContentLoaded', function () {
    var iconMap = {
      dashboard: 'dashboard', jogadores: 'players', jogos: 'matches', escalacao: 'lineup',
      campeonatos: 'championship', amistosos: 'friendly', calendario: 'calendar',
      estatisticas: 'stats', confrontos: 'versus', compartilhamentos: 'share',
      documentos: 'docs', configuracoes: 'settings'
    };
    document.querySelectorAll('.nav-link[data-route]').forEach(function (link) {
      var key = iconMap[link.dataset.route];
      if (!key || !App.Icons[key]) return;
      var labelSpan = link.querySelector('span');
      var label = labelSpan ? labelSpan.outerHTML : link.textContent.trim();
      link.innerHTML = App.Icons[key] + (labelSpan ? label : '<span>' + label + '</span>');
    });
  });
</script>

</body>
</html>
