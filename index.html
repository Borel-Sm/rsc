<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube — Painel Oficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM — TOKENS
   ============================================================ */
:root{
  /* Cor */
  --blue-50:  #eef6ff;
  --blue-100: #dcedff;
  --blue-300: #8fc2ff;
  --blue-500: #3b9eff;   /* azul claro — cor principal do clube */
  --blue-600: #2b7fe0;
  --blue-700: #1f63b8;
  --ink-900:  #0e1622;
  --ink-700:  #2b3648;
  --ink-500:  #6b7686;
  --ink-300:  #a6b0bd;
  --white:    #ffffff;
  --gray-25:  #fbfcfe;
  --gray-50:  #f5f8fb;
  --gray-100: #eef2f7;
  --gray-200: #e3e9f0;

  --success: #1fbf75;
  --warning: #ff9f43;
  --danger:  #ff5470;

  /* Tipografia */
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;

  /* Espaçamento */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;
  --sp-9: 56px; --sp-10: 72px;

  /* Raio */
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;

  /* Sombra */
  --shadow-sm: 0 1px 2px rgba(14,22,34,0.04), 0 1px 1px rgba(14,22,34,0.03);
  --shadow-md: 0 8px 24px rgba(14,22,34,0.06), 0 2px 6px rgba(14,22,34,0.04);
  --shadow-lg: 0 20px 48px rgba(14,22,34,0.10), 0 6px 16px rgba(14,22,34,0.05);
  --shadow-blue: 0 10px 28px rgba(59,158,255,0.28);

  /* Transição */
  --ease: cubic-bezier(.4,0,.2,1);
  --ease-out: cubic-bezier(0,0,.2,1);
  --t-fast: 140ms;
  --t-med: 260ms;
  --t-slow: 420ms;

  --sidebar-w: 268px;
  --sidebar-w-collapsed: 84px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  font-family: var(--font-body);
  background: var(--gray-50);
  color: var(--ink-900);
  -webkit-font-smoothing: antialiased;
  overflow-x:hidden;
}
::selection{ background: var(--blue-300); color:var(--ink-900); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background: var(--gray-200); border-radius: var(--r-full); }
::-webkit-scrollbar-thumb:hover{ background: var(--ink-300); }

a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; border:none; cursor:pointer; background:none; }
:focus-visible{ outline: 2px solid var(--blue-500); outline-offset: 2px; border-radius: var(--r-sm); }

h1,h2,h3,h4{ font-family: var(--font-display); letter-spacing:-0.02em; color: var(--ink-900); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}

/* ============================================================
   LOADING SCREEN
   ============================================================ */
#loading{
  position:fixed; inset:0; background: var(--white);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  z-index:9999; transition: opacity var(--t-slow) var(--ease), visibility var(--t-slow);
  gap: var(--sp-5);
}
#loading.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
.load-crest{
  width:72px; height:72px; border-radius: var(--r-lg);
  background: linear-gradient(150deg, var(--blue-500), var(--blue-700));
  display:flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-blue);
  animation: crestPulse 1.8s var(--ease) infinite;
}
.load-crest svg{ width:34px; height:34px; }
@keyframes crestPulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.06); }
}
.load-bar{ width:160px; height:3px; background: var(--gray-100); border-radius: var(--r-full); overflow:hidden; }
.load-bar-fill{ height:100%; width:30%; background: var(--blue-500); border-radius: var(--r-full); animation: loadSlide 1.1s var(--ease) infinite; }
@keyframes loadSlide{
  0%{ transform: translateX(-100%); }
  100%{ transform: translateX(340%); }
}
.load-label{ font-size:12.5px; color: var(--ink-500); letter-spacing:0.06em; text-transform:uppercase; font-weight:600; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app{ display:flex; min-height:100vh; }

/* ---------- SIDEBAR ---------- */
.sidebar{
  width: var(--sidebar-w);
  flex-shrink:0;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-right: 1px solid var(--gray-200);
  display:flex; flex-direction:column;
  height:100vh; position:sticky; top:0;
  transition: width var(--t-med) var(--ease);
  z-index:100;
}
.sidebar.collapsed{ width: var(--sidebar-w-collapsed); }

.brand{
  display:flex; align-items:center; gap:var(--sp-3);
  padding: var(--sp-6) var(--sp-5);
  border-bottom:1px solid var(--gray-100);
}
.crest{
  width:38px; height:38px; border-radius:var(--r-md); flex-shrink:0;
  background: linear-gradient(150deg, var(--blue-500), var(--blue-700));
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 12px rgba(59,158,255,0.3);
}
.crest svg{ width:20px; height:20px; }
.brand-text{ overflow:hidden; white-space:nowrap; transition: opacity var(--t-fast); }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:15px; }
.brand-sub{ font-size:11.5px; color:var(--ink-500); font-weight:500; }
.sidebar.collapsed .brand-text{ opacity:0; width:0; }

.nav{ flex:1; overflow-y:auto; padding: var(--sp-4) var(--sp-3); display:flex; flex-direction:column; gap:2px; }
.nav-item{
  display:flex; align-items:center; gap:var(--sp-3);
  padding: 10px var(--sp-3);
  border-radius: var(--r-md);
  color: var(--ink-700); font-size:14px; font-weight:500;
  position:relative; white-space:nowrap; overflow:hidden;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.nav-item:hover{ background: var(--gray-100); color: var(--ink-900); }
.nav-item.active{ background: var(--blue-50); color: var(--blue-700); }
.nav-item.active .nav-icon{ color: var(--blue-600); }
.nav-item.active::before{
  content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
  width:3px; height:18px; background:var(--blue-500); border-radius:0 4px 4px 0;
}
.nav-icon{ width:18px; height:18px; flex-shrink:0; color:var(--ink-500); display:flex; align-items:center; justify-content:center; }
.nav-label{ transition: opacity var(--t-fast); }
.sidebar.collapsed .nav-label{ opacity:0; width:0; }
.sidebar.collapsed .nav-item{ justify-content:center; }

.sidebar-footer{ padding: var(--sp-4) var(--sp-3); border-top:1px solid var(--gray-100); }
.collapse-btn{
  width:100%; display:flex; align-items:center; justify-content:center; gap:var(--sp-2);
  padding:10px; border-radius:var(--r-md); color:var(--ink-500); font-size:13px; font-weight:500;
  transition: background var(--t-fast);
}
.collapse-btn:hover{ background: var(--gray-100); color:var(--ink-900); }
.collapse-btn svg{ transition: transform var(--t-med) var(--ease); }
.sidebar.collapsed .collapse-btn svg{ transform: rotate(180deg); }
.sidebar.collapsed .collapse-btn span{ display:none; }

/* ---------- MAIN ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  height:72px; flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 var(--sp-8);
  position:sticky; top:0; z-index:50;
  background: rgba(245,248,251,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom:1px solid transparent;
}
.topbar.scrolled{ border-bottom-color: var(--gray-200); }
.topbar-title{ font-size:22px; font-weight:700; }
.topbar-sub{ font-size:13px; color:var(--ink-500); margin-top:2px; }
.topbar-actions{ display:flex; align-items:center; gap:var(--sp-3); }
.icon-btn{
  width:38px; height:38px; border-radius:var(--r-full); background:var(--white);
  border:1px solid var(--gray-200); display:flex; align-items:center; justify-content:center;
  color:var(--ink-700); box-shadow:var(--shadow-sm); transition: all var(--t-fast) var(--ease);
  position:relative;
}
.icon-btn:hover{ transform: translateY(-1px); box-shadow:var(--shadow-md); border-color:var(--blue-300); color:var(--blue-600); }
.icon-btn svg{ width:17px; height:17px; }
.dot-badge{
  position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%;
  background: var(--danger); border:1.5px solid var(--white);
}
.avatar{
  width:38px; height:38px; border-radius:var(--r-full);
  background: linear-gradient(150deg, var(--blue-500), var(--blue-700));
  display:flex; align-items:center; justify-content:center;
  color:white; font-size:13px; font-weight:700; font-family:var(--font-display);
}

.view{ padding: var(--sp-7) var(--sp-8) var(--sp-10); }
.view-header{ margin-bottom: var(--sp-7); }
.view-header h1{ font-size:26px; font-weight:700; margin-bottom:4px; }
.view-header p{ color:var(--ink-500); font-size:14px; }

/* ============================================================
   COMPONENTS — CARD
   ============================================================ */
.card{
  background: var(--white);
  border: 1px solid var(--gray-100);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--t-med) var(--ease), transform var(--t-med) var(--ease), border-color var(--t-med) var(--ease);
}
.card.hoverable:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--gray-200); }

/* stagger-in animation */
.stagger{ opacity:0; transform: translateY(14px); animation: cascadeIn var(--t-slow) var(--ease-out) forwards; }
@keyframes cascadeIn{ to{ opacity:1; transform:translateY(0); } }

/* ---------- KPI GRID ---------- */
.kpi-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-5); margin-bottom: var(--sp-6); }
.kpi-card{ padding: var(--sp-5) var(--sp-6); display:flex; flex-direction:column; gap: var(--sp-3); }
.kpi-top{ display:flex; align-items:center; justify-content:space-between; }
.kpi-label{ font-size:12.5px; color:var(--ink-500); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
.kpi-icon{ width:32px; height:32px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; background:var(--blue-50); color:var(--blue-600); }
.kpi-icon svg{ width:16px; height:16px; }
.kpi-value{ font-family:var(--font-display); font-size:30px; font-weight:700; letter-spacing:-0.02em; }
.kpi-delta{ font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:3px; }
.kpi-delta.up{ color:var(--success); }
.kpi-delta.down{ color:var(--danger); }
.kpi-delta.neutral{ color:var(--ink-500); }

/* ---------- MAIN GRID ---------- */
.main-grid{ display:grid; grid-template-columns: 1.3fr 1fr; gap: var(--sp-5); margin-bottom: var(--sp-5); }

/* ---------- NEXT MATCH (signature element) ---------- */
.next-match{
  position:relative; overflow:hidden;
  background: linear-gradient(135deg, #0e2a4d 0%, #133a6b 45%, var(--blue-600) 100%);
  border-radius: var(--r-xl);
  padding: var(--sp-7);
  color: white;
  min-height: 300px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.next-match::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle at 85% 15%, rgba(255,255,255,0.14), transparent 45%),
    radial-gradient(circle at 10% 100%, rgba(255,255,255,0.08), transparent 40%);
  pointer-events:none;
}
.nm-eyebrow{ font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.65); display:flex; align-items:center; gap:8px; }
.nm-eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:#5fe0a5; box-shadow:0 0 0 4px rgba(95,224,165,0.25); }

.nm-teams{ display:flex; align-items:center; justify-content:center; gap: var(--sp-7); margin: var(--sp-5) 0; position:relative; z-index:1; }
.nm-team{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); width:120px; }
.nm-shield{
  width:64px; height:64px; border-radius:var(--r-md);
  background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18);
  display:flex; align-items:center; justify-content:center; backdrop-filter: blur(6px);
}
.nm-shield.home{ background: linear-gradient(150deg, var(--blue-300), var(--blue-500)); border:none; }
.nm-shield svg{ width:30px; height:30px; }
.nm-team-name{ font-size:13.5px; font-weight:600; text-align:center; }
.nm-vs{ font-family:var(--font-display); font-size:15px; color:rgba(255,255,255,0.5); font-weight:600; }

.nm-countdown{ display:flex; gap:var(--sp-3); justify-content:center; position:relative; z-index:1; }
.nm-time{ text-align:center; }
.nm-time-val{ font-family:var(--font-display); font-size:24px; font-weight:700; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); border-radius:var(--r-sm); padding:6px 12px; min-width:52px; }
.nm-time-label{ font-size:10.5px; color:rgba(255,255,255,0.55); margin-top:6px; text-transform:uppercase; letter-spacing:0.06em; }

.nm-meta{ display:flex; justify-content:space-between; align-items:flex-end; position:relative; z-index:1; margin-top:var(--sp-5); font-size:13px; color:rgba(255,255,255,0.75); }
.nm-meta-item{ display:flex; align-items:center; gap:6px; }
.nm-meta-item svg{ width:14px; height:14px; opacity:0.7; }

/* ---------- LAST RESULT ---------- */
.last-result{ padding: var(--sp-6); display:flex; flex-direction:column; gap:var(--sp-5); }
.card-title-row{ display:flex; align-items:center; justify-content:space-between; }
.card-title{ font-size:13.5px; font-weight:700; color:var(--ink-700); }
.card-tag{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:var(--r-full); background:var(--gray-100); color:var(--ink-500); }
.lr-score{ display:flex; align-items:center; justify-content:center; gap:var(--sp-5); padding: var(--sp-4) 0; }
.lr-team{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-2); flex:1; }
.lr-shield{ width:44px; height:44px; border-radius:var(--r-sm); background:var(--gray-100); display:flex; align-items:center; justify-content:center; }
.lr-shield.home{ background: linear-gradient(150deg, var(--blue-300), var(--blue-500)); }
.lr-shield svg{ width:22px; height:22px; }
.lr-name{ font-size:12px; font-weight:600; color:var(--ink-700); text-align:center; }
.lr-score-num{ font-family:var(--font-display); font-size:32px; font-weight:700; letter-spacing:-0.02em; }
.badge-result{ align-self:center; font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:var(--r-full); }
.badge-result.win{ background:#e6f9f0; color:var(--success); }

/* ---------- SECONDARY GRID ---------- */
.sec-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-5); }
.list-card{ padding: var(--sp-6); }
.list-row{ display:flex; align-items:center; gap:var(--sp-3); padding: var(--sp-3) 0; border-bottom:1px solid var(--gray-100); }
.list-row:last-child{ border-bottom:none; padding-bottom:0; }
.list-rank{ width:22px; height:22px; border-radius:var(--r-sm); background:var(--gray-100); color:var(--ink-500); font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.list-row:first-child .list-rank{ background: var(--blue-500); color:white; }
.list-player-avatar{ width:34px; height:34px; border-radius:50%; background:var(--gray-200); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-500); }
.list-info{ flex:1; min-width:0; }
.list-name{ font-size:13.5px; font-weight:600; color:var(--ink-900); }
.list-sub{ font-size:11.5px; color:var(--ink-500); }
.list-value{ font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--blue-600); }

/* ---------- ALERTS ---------- */
.alert{ display:flex; align-items:center; gap:var(--sp-3); padding: var(--sp-3) var(--sp-4); border-radius:var(--r-md); background: var(--gray-50); border:1px solid var(--gray-100); margin-bottom:var(--sp-2); }
.alert:last-child{ margin-bottom:0; }
.alert.urgent{ background: #fff5f0; border-color:#ffdccb; }
.alert-icon{ width:30px; height:30px; border-radius:50%; background:var(--blue-50); color:var(--blue-600); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.alert.urgent .alert-icon{ background:#ffe6d8; color:#e2732b; }
.alert-icon svg{ width:15px; height:15px; }
.alert-text{ font-size:13px; font-weight:500; color:var(--ink-700); }

/* ---------- Progress bar ---------- */
.progress-track{ height:8px; background:var(--gray-100); border-radius:var(--r-full); overflow:hidden; }
.progress-fill{ height:100%; border-radius:var(--r-full); background: linear-gradient(90deg, var(--blue-500), var(--blue-300)); width:0%; transition: width 1.1s var(--ease-out); }

/* ============================================================
   EMPTY STATE (para as demais páginas do menu)
   ============================================================ */
.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding: var(--sp-10) var(--sp-6);
  background: var(--white); border:1px dashed var(--gray-200); border-radius: var(--r-xl);
}
.empty-icon{
  width:56px; height:56px; border-radius:var(--r-lg); background:var(--blue-50); color:var(--blue-500);
  display:flex; align-items:center; justify-content:center; margin-bottom:var(--sp-5);
}
.empty-icon svg{ width:26px; height:26px; }
.empty-state h3{ font-size:17px; margin-bottom:6px; }
.empty-state p{ color:var(--ink-500); font-size:13.5px; max-width:360px; margin-bottom:var(--sp-5); }
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:var(--r-md);
  font-size:13.5px; font-weight:600; transition: all var(--t-fast) var(--ease);
}
.btn-primary{ background: var(--blue-500); color:white; box-shadow: 0 6px 16px rgba(59,158,255,0.3); }
.btn-primary:hover{ background: var(--blue-600); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(59,158,255,0.38); }
.btn svg{ width:15px; height:15px; }

/* ---------- Mobile bottom nav / responsive ---------- */
.mobile-topbar{ display:none; }
.mobile-nav{ display:none; }

@media (max-width: 1080px){
  .kpi-grid{ grid-template-columns: repeat(2,1fr); }
  .main-grid{ grid-template-columns:1fr; }
  .sec-grid{ grid-template-columns:1fr; }
}

@media (max-width: 860px){
  .sidebar{ position:fixed; left:0; top:0; transform: translateX(-100%); box-shadow: var(--shadow-lg); }
  .sidebar.mobile-open{ transform: translateX(0); }
  .sidebar-footer{ display:none; }
  .main{ width:100%; }
  .topbar{ padding: 0 var(--sp-5); }
  .view{ padding: var(--sp-5) var(--sp-5) 100px; }
  .kpi-grid{ grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .kpi-value{ font-size:24px; }
  .nm-teams{ gap: var(--sp-5); }
  .nm-team{ width:90px; }
  .mobile-menu-btn{ display:flex !important; }
  .backdrop{ display:block; }
}
.mobile-menu-btn{ display:none; }
.backdrop{
  display:none; position:fixed; inset:0; background:rgba(14,22,34,0.35); backdrop-filter: blur(2px);
  z-index:90; opacity:0; pointer-events:none; transition: opacity var(--t-med) var(--ease);
}
.backdrop.show{ opacity:1; pointer-events:auto; }

/* Command palette (bônus sugerido na Fase 1) */
.cmdk-overlay{
  position:fixed; inset:0; background:rgba(14,22,34,0.45); backdrop-filter: blur(3px);
  z-index:200; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;
  opacity:0; pointer-events:none; transition: opacity var(--t-med) var(--ease);
}
.cmdk-overlay.show{ opacity:1; pointer-events:auto; }
.cmdk-box{
  width:min(560px, 90vw); background:white; border-radius:var(--r-lg); box-shadow: var(--shadow-lg);
  overflow:hidden; transform: translateY(-10px) scale(0.98); transition: transform var(--t-med) var(--ease);
}
.cmdk-overlay.show .cmdk-box{ transform: translateY(0) scale(1); }
.cmdk-input{ width:100%; padding: var(--sp-5); font-size:15px; border:none; border-bottom:1px solid var(--gray-100); outline:none; font-family:inherit; }
.cmdk-list{ max-height:320px; overflow-y:auto; padding: var(--sp-2); }
.cmdk-item{ display:flex; align-items:center; gap:var(--sp-3); padding:10px var(--sp-4); border-radius:var(--r-md); font-size:13.5px; font-weight:500; color:var(--ink-700); }
.cmdk-item:hover, .cmdk-item.sel{ background:var(--blue-50); color:var(--blue-700); }
.cmdk-item svg{ width:16px; height:16px; color:var(--ink-500); }
.cmdk-item:hover svg, .cmdk-item.sel svg{ color:var(--blue-600); }
.cmdk-hint{ padding: var(--sp-3) var(--sp-5); font-size:11.5px; color:var(--ink-300); border-top:1px solid var(--gray-100); display:flex; gap:var(--sp-4); }
</style>
</head>
<body>

<!-- ============ LOADING SCREEN ============ -->
<div id="loading">
  <div class="load-crest">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 2 L20 6 V12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 V6 Z"/><path d="M8 12 L11 15 L16 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="load-bar"><div class="load-bar-fill"></div></div>
  <div class="load-label">Carregando painel do clube</div>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="crest">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 2 L20 6 V12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 V6 Z"/><path d="M8 12 L11 15 L16 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Clube Atlético</div>
        <div class="brand-sub">Temporada 2026</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <button class="collapse-btn" id="collapseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Recolher menu</span>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar" id="topbar">
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div>
          <div class="topbar-title" id="pageTitle">Dashboard</div>
          <div class="topbar-sub" id="pageSub">Visão geral da temporada</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="cmdkBtn" aria-label="Busca rápida">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn" aria-label="Notificações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot-badge"></span>
        </button>
        <div class="avatar">CA</div>
      </div>
    </header>

    <div class="view" id="view"></div>
  </main>
</div>

<!-- ============ COMMAND PALETTE ============ -->
<div class="cmdk-overlay" id="cmdkOverlay">
  <div class="cmdk-box">
    <input class="cmdk-input" id="cmdkInput" placeholder="Buscar módulo, jogador, partida…" autocomplete="off">
    <div class="cmdk-list" id="cmdkList"></div>
    <div class="cmdk-hint"><span>↑↓ navegar</span><span>↵ selecionar</span><span>esc fechar</span></div>
  </div>
</div>

<script>
/* ============================================================
   DADOS MOCK (preview apenas — Fase 3 conecta ao Firestore)
   ============================================================ */
const CLUB = { name: 'Clube Atlético', season: 2026 };

const MENU = [
  { id:'dashboard', label:'Dashboard', icon:'home' },
  { id:'agenda', label:'Agenda', icon:'calendar' },
  { id:'jogos', label:'Jogos', icon:'ball' },
  { id:'campeonatos', label:'Campeonatos', icon:'trophy' },
  { id:'amistosos', label:'Amistosos', icon:'handshake' },
  { id:'jogadores', label:'Jogadores', icon:'users' },
  { id:'estatisticas', label:'Estatísticas', icon:'chart' },
  { id:'confrontos', label:'Confrontos', icon:'swords' },
  { id:'compartilhamentos', label:'Compartilhamentos', icon:'share' },
  { id:'documentos', label:'Documentos', icon:'folder' },
  { id:'configuracoes', label:'Configurações', icon:'settings' },
];

const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  ball: '<circle cx="12" cy="12" r="9"/><path d="M12 7l3 3-1 4H10l-1-4z"/><path d="M12 3v4M4.5 9l3-.5M4.5 15l3 .5M19.5 9l-3-.5M19.5 15l-3 .5M12 17v4"/>',
  trophy: '<path d="M8 21h8M12 17v4M6 4h12v4a6 6 0 0 1-12 0z"/><path d="M6 5H3v2a4 4 0 0 0 3 3.9M18 5h3v2a4 4 0 0 1-3 3.9"/>',
  handshake: '<path d="M8 12l3 3 6-6"/><path d="M2 12l5-4 4 2 3-2 5 4-3 4-2-1-3 3-4-1-5-5z"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14a5 5 0 0 1 5.5 5"/>',
  chart: '<path d="M4 20V10M12 20V4M20 20v-7"/><path d="M3 20h18"/>',
  swords: '<path d="M5 19l6-6M14.5 8.5 21 2l-1 5-4 1zM9.5 8.5 3 2l1 5 4 1z"/><path d="M19 19l-6-6"/>',
  share: '<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8 15.8 7M8.2 13.2l7.6 3.8"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
};
function icon(name, extra=''){ return `<svg class="${extra}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`; }

const STATE = {
  nextMatch: { opponent:'Vila Nova FC', date: new Date(Date.now() + 1000*60*60*54), local:'Estádio Municipal', comp:'Campeonato Regional' },
  lastResult: { opponent:'Independente EC', home:3, away:1, isWin:true },
  season: { played:14, wins:9, draws:3, losses:2, points:30, gf:29, ga:14, gd:15, aproveitamento:71 },
  topScorers: [ {name:'Rafael Souza', value:11}, {name:'Lucas Martins', value:8}, {name:'Bruno Alves', value:6} ],
  topAssists: [ {name:'Diego Lima', value:9}, {name:'Rafael Souza', value:6}, {name:'Pedro Costa', value:5} ],
  alerts: [ {text:'Faltam 2 dias para o próximo jogo', urgent:false}, {text:'Amistoso confirmado para sábado', urgent:false} ],
};

/* ============================================================
   RENDER SIDEBAR
   ============================================================ */
const navEl = document.getElementById('nav');
navEl.innerHTML = MENU.map(m => `
  <a href="#${m.id}" class="nav-item" data-route="${m.id}">
    <span class="nav-icon">${icon(m.icon)}</span>
    <span class="nav-label">${m.label}</span>
  </a>`).join('');

function setActiveNav(route){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.route === route);
  });
}

/* ============================================================
   VIEWS
   ============================================================ */
function fmtCountdown(target){
  const diff = Math.max(0, target - new Date());
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  return {d,h,m,s};
}

function viewDashboard(){
  const c = fmtCountdown(STATE.nextMatch.date);
  const s = STATE.season;
  return `
  <div class="view-header stagger" style="animation-delay:.02s">
    <h1>Bem-vindo, ${CLUB.name}</h1>
    <p>Aqui está o panorama da temporada ${CLUB.season}</p>
  </div>

  <div class="kpi-grid">
    ${kpi('Pontos', s.points, 'trophy', '+3 na última rodada', 'up', .06)}
    ${kpi('Aproveitamento', s.aproveitamento+'%', 'chart', 'acima da média', 'up', .1)}
    ${kpi('Saldo de gols', (s.gd>0?'+':'')+s.gd, 'ball', s.gf+' marcados · '+s.ga+' sofridos', 'neutral', .14)}
    ${kpi('Jogos disputados', s.played, 'calendar', s.wins+'V '+s.draws+'E '+s.losses+'D', 'neutral', .18)}
  </div>

  <div class="main-grid">
    <div class="next-match card stagger" style="animation-delay:.22s">
      <div class="nm-eyebrow">Próximo jogo · ${STATE.nextMatch.comp}</div>
      <div class="nm-teams">
        <div class="nm-team">
          <div class="nm-shield home">${icon('trophy')}</div>
          <div class="nm-team-name">${CLUB.name}</div>
        </div>
        <div class="nm-vs">VS</div>
        <div class="nm-team">
          <div class="nm-shield">${icon('ball')}</div>
          <div class="nm-team-name">${STATE.nextMatch.opponent}</div>
        </div>
      </div>
      <div class="nm-countdown">
        <div class="nm-time"><div class="nm-time-val" id="cd-d">${c.d}</div><div class="nm-time-label">dias</div></div>
        <div class="nm-time"><div class="nm-time-val" id="cd-h">${c.h}</div><div class="nm-time-label">horas</div></div>
        <div class="nm-time"><div class="nm-time-val" id="cd-m">${c.m}</div><div class="nm-time-label">min</div></div>
        <div class="nm-time"><div class="nm-time-val" id="cd-s">${c.s}</div><div class="nm-time-label">seg</div></div>
      </div>
      <div class="nm-meta">
        <div class="nm-meta-item">${icon('calendar')} ${STATE.nextMatch.date.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'})}</div>
        <div class="nm-meta-item">${icon('folder')} ${STATE.nextMatch.local}</div>
      </div>
    </div>

    <div class="last-result card hoverable stagger" style="animation-delay:.26s">
      <div class="card-title-row">
        <span class="card-title">Último resultado</span>
        <span class="card-tag">${STATE.lastResult.opponent}</span>
      </div>
      <div class="lr-score">
        <div class="lr-team">
          <div class="lr-shield home">${icon('trophy')}</div>
          <div class="lr-name">${CLUB.name}</div>
        </div>
        <div class="lr-score-num">${STATE.lastResult.home} — ${STATE.lastResult.away}</div>
        <div class="lr-team">
          <div class="lr-shield">${icon('ball')}</div>
          <div class="lr-name">${STATE.lastResult.opponent}</div>
        </div>
      </div>
      <div class="badge-result win">Vitória</div>
      <div>
        <div style="display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-500); margin-bottom:6px;">
          <span>Aproveitamento na temporada</span><span>${s.aproveitamento}%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progFill" style="width:${s.aproveitamento}%"></div></div>
      </div>
    </div>
  </div>

  <div class="sec-grid">
    <div class="list-card card hoverable stagger" style="animation-delay:.3s">
      <div class="card-title-row" style="margin-bottom:14px;"><span class="card-title">Artilharia</span><span class="card-tag">Temporada</span></div>
      ${STATE.topScorers.map((p,i)=>listRow(p,i)).join('')}
    </div>
    <div class="list-card card hoverable stagger" style="animation-delay:.34s">
      <div class="card-title-row" style="margin-bottom:14px;"><span class="card-title">Assistências</span><span class="card-tag">Temporada</span></div>
      ${STATE.topAssists.map((p,i)=>listRow(p,i)).join('')}
    </div>
    <div class="list-card card hoverable stagger" style="animation-delay:.38s">
      <div class="card-title-row" style="margin-bottom:14px;"><span class="card-title">Alertas</span></div>
      ${STATE.alerts.map(a=>`
        <div class="alert ${a.urgent?'urgent':''}">
          <div class="alert-icon">${icon('calendar')}</div>
          <div class="alert-text">${a.text}</div>
        </div>`).join('')}
    </div>
  </div>
  `;
}

function kpi(label,value,ic,delta,trend,delay){
  const arrow = trend==='up' ? '↑' : trend==='down' ? '↓' : '•';
  return `
  <div class="card kpi-card hoverable stagger" style="animation-delay:${delay}s">
    <div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-icon">${icon(ic)}</span></div>
    <span class="kpi-value" data-count="${value}">${value}</span>
    <span class="kpi-delta ${trend}">${arrow} ${delta}</span>
  </div>`;
}
function listRow(p,i){
  const initials = p.name.split(' ').map(n=>n[0]).slice(0,2).join('');
  return `
  <div class="list-row">
    <div class="list-rank">${i+1}</div>
    <div class="list-player-avatar">${initials}</div>
    <div class="list-info"><div class="list-name">${p.name}</div><div class="list-sub">Jogador</div></div>
    <div class="list-value">${p.value}</div>
  </div>`;
}

function viewEmpty(route){
  const meta = MENU.find(m=>m.id===route);
  const descriptions = {
    agenda: 'Cadastre partidas para vê-las organizadas em um calendário elegante.',
    jogos: 'Registre o primeiro jogo para começar a gerar estatísticas automaticamente.',
    campeonatos: 'Crie um campeonato para acompanhar tabela e classificação em tempo real.',
    amistosos: 'Nenhum amistoso cadastrado ainda nesta temporada.',
    jogadores: 'Adicione jogadores ao elenco para começar a acompanhar o desempenho.',
    estatisticas: 'As estatísticas aparecerão aqui assim que houver partidas registradas.',
    confrontos: 'Selecione uma partida para gerar a arte de confronto automaticamente.',
    compartilhamentos: 'Gere conteúdos prontos para WhatsApp assim que houver dados na temporada.',
    documentos: 'Nenhum documento enviado. Envie regulamentos, tabelas e comunicados aqui.',
    configuracoes: 'Ajuste nome, escudo, cores e temporada do clube.',
  };
  return `
  <div class="view-header stagger">
    <h1>${meta.label}</h1>
    <p>Módulo em construção — Fase seguinte da metodologia</p>
  </div>
  <div class="empty-state stagger" style="animation-delay:.06s">
    <div class="empty-icon">${icon(meta.icon)}</div>
    <h3>Nada por aqui ainda</h3>
    <p>${descriptions[route] || 'Este módulo será detalhado nas próximas fases do projeto.'}</p>
    <button class="btn btn-primary">${icon('plus')} Adicionar</button>
  </div>`;
}

const TITLES = {
  dashboard:['Dashboard','Visão geral da temporada'],
  agenda:['Agenda','Calendário de partidas'],
  jogos:['Jogos','Histórico e detalhes das partidas'],
  campeonatos:['Campeonatos','Tabelas e classificação'],
  amistosos:['Amistosos','Jogos fora de competição oficial'],
  jogadores:['Jogadores','Elenco do clube'],
  estatisticas:['Estatísticas','Números da temporada'],
  confrontos:['Confrontos','Artes de divulgação de partidas'],
  compartilhamentos:['Compartilhamentos','Conteúdo pronto para redes sociais'],
  documentos:['Documentos','Arquivos oficiais do clube'],
  configuracoes:['Configurações','Preferências do clube'],
};

/* ============================================================
   ROUTER (SPA — sem reload)
   ============================================================ */
const viewEl = document.getElementById('view');
function render(route){
  if(!TITLES[route]) route = 'dashboard';
  document.getElementById('pageTitle').textContent = TITLES[route][0];
  document.getElementById('pageSub').textContent = TITLES[route][1];
  viewEl.innerHTML = route === 'dashboard' ? viewDashboard() : viewEmpty(route);
  setActiveNav(route);
  if(route === 'dashboard') startCountdown();
  closeMobileSidebar();
}
function navigate(){
  const route = location.hash.replace('#','') || 'dashboard';
  render(route);
}
window.addEventListener('hashchange', navigate);

/* ============================================================
   COUNTDOWN LIVE
   ============================================================ */
let cdInterval;
function startCountdown(){
  clearInterval(cdInterval);
  cdInterval = setInterval(()=>{
    const c = fmtCountdown(STATE.nextMatch.date);
    const dEl=document.getElementById('cd-d'), hEl=document.getElementById('cd-h'), mEl=document.getElementById('cd-m'), sEl=document.getElementById('cd-s');
    if(!dEl) return clearInterval(cdInterval);
    dEl.textContent=c.d; hEl.textContent=String(c.h).padStart(2,'0'); mEl.textContent=String(c.m).padStart(2,'0'); sEl.textContent=String(c.s).padStart(2,'0');
  },1000);
}

/* ============================================================
   SIDEBAR COLLAPSE / MOBILE
   ============================================================ */
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
document.getElementById('collapseBtn').addEventListener('click', ()=> sidebar.classList.toggle('collapsed'));
document.getElementById('mobileMenuBtn').addEventListener('click', ()=>{
  sidebar.classList.add('mobile-open'); backdrop.classList.add('show');
});
backdrop.addEventListener('click', closeMobileSidebar);
function closeMobileSidebar(){ sidebar.classList.remove('mobile-open'); backdrop.classList.remove('show'); }

/* Topbar shadow on scroll */
document.querySelector('.main').addEventListener('scroll', ()=>{}, {passive:true});
window.addEventListener('scroll', ()=>{
  document.getElementById('topbar').classList.toggle('scrolled', window.scrollY>4);
});
document.querySelector('.view')?.addEventListener('scroll', ()=>{}); // reserved

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
const cmdkOverlay = document.getElementById('cmdkOverlay');
const cmdkInput = document.getElementById('cmdkInput');
const cmdkList = document.getElementById('cmdkList');
let cmdkSel = 0, cmdkItems = [];

function openCmdk(){
  cmdkOverlay.classList.add('show'); cmdkInput.value=''; renderCmdk(''); cmdkInput.focus();
}
function closeCmdk(){ cmdkOverlay.classList.remove('show'); }
function renderCmdk(q){
  const filtered = MENU.filter(m=> m.label.toLowerCase().includes(q.toLowerCase()));
  cmdkItems = filtered;
  cmdkSel = 0;
  cmdkList.innerHTML = filtered.map((m,i)=>`
    <div class="cmdk-item ${i===0?'sel':''}" data-route="${m.id}">${icon(m.icon)}<span>${m.label}</span></div>
  `).join('') || `<div class="cmdk-item" style="color:var(--ink-300)">Nenhum resultado</div>`;
}
document.getElementById('cmdkBtn').addEventListener('click', openCmdk);
cmdkOverlay.addEventListener('click', e=>{ if(e.target===cmdkOverlay) closeCmdk(); });
cmdkInput.addEventListener('input', e=> renderCmdk(e.target.value));
cmdkList.addEventListener('click', e=>{
  const item = e.target.closest('.cmdk-item');
  if(item && item.dataset.route){ location.hash = item.dataset.route; closeCmdk(); }
});
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmdk(); }
  if(e.key === 'Escape') closeCmdk();
  if(cmdkOverlay.classList.contains('show')){
    if(e.key==='ArrowDown'){ e.preventDefault(); cmdkSel=Math.min(cmdkSel+1, cmdkItems.length-1); updateCmdkSel(); }
    if(e.key==='ArrowUp'){ e.preventDefault(); cmdkSel=Math.max(cmdkSel-1,0); updateCmdkSel(); }
    if(e.key==='Enter' && cmdkItems[cmdkSel]){ location.hash = cmdkItems[cmdkSel].id; closeCmdk(); }
  }
});
function updateCmdkSel(){
  [...cmdkList.children].forEach((el,i)=> el.classList.toggle('sel', i===cmdkSel));
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('load', ()=>{
  setTimeout(()=>{ document.getElementById('loading').classList.add('hidden'); }, 650);
});
navigate();
</script>
</body>
</html>
